{{- $poems := where .Site.RegularPages "Section" "poetry" }}

{{- if $poems }}
<div class="widget-recent widget">
  <h4 class="widget__title">Recent Poems</h4>
  <div class="widget__content">
    {{ range first 5 (where .Site.RegularPages "Section" "poetry") }}
      <div class="widget__item">
        <a class="widget__link" href="{{ .RelPermalink }}">{{ .Title }}</a>
      </div>
    {{ end }}
  </div>
</div>
{{- end }}
