baseURL = 'https://example.org/'
languageCode = 'en-us'
title = 'Hits By Hali'
theme = 'mainroad'

[Params]
  googleFontsLink = "local"
  post_meta = ["author", "date", "categories", "translations"]
  customCSS = ["css/global.css", "css/home.css", "css/gallery.css", "css/links.css", "css/posts.css", "css/mobile-nav.css", "css/booking.css"]
  customJS = ["js/filmreel.js"]
  mainSections = ["posts"]
  
[Params.menu]
  menu="main"

[Params.sidebar]
  home = "right"
  list = "right"
  single = "right"
  # Enable widgets in given order
  widgets = ["recent-music", "recent","recent-poetry", "categories", "taglist", "social"]
[Params.logo]
  image = "img/haliweblogo.svg"
  title = "Hits By H. Ali"
  subtitle = "What I've Been Making"


[Params.style.vars]
  highlightColor = "#0B9DBB"
  fontFamilyPrimary = "ui-rounded, 'Hiragino Maru Gothic ProN', Quicksand, Comfortaa, Manjari, 'Arial Rounded MT', 'Arial Rounded MT Bold', Calibri, source-sans-pro, sans-serif"



[params.meta]
  Favicon = true
  svg = true
  

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[security]
  enableInlineShortcodes = true

[menus]
  [[menus.main]]
    name = 'Music'
    pageRef = '/music'
    weight = 10
  [[menus.main]]
    name = 'Blog'
    pageRef = '/posts'
    weight = 20
  [[menus.main]]
    name = 'Gallery'
    pageRef = '/gallery'
    weight = 30
  [[menus.main]]
    name = 'Booking'
    pageRef = '/booking'
    weight = 50
  [[menus.main]]
    name = 'Links'
    pageRef = '/links'
    weight = 60
  
  # Poetry hidden from nav until ready
  # [[menus.main]]
  #   name = 'Poetry'
  #   pageRef = '/poetry'
  #   weight = 40